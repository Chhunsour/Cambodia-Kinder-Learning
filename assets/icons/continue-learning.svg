<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <style>
      /* <![CDATA[ */
      @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@700&family=Nunito:wght@800&display=swap');

      .card-container {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      
      text {
        user-select: none;
        -webkit-user-select: none;
        pointer-events: none;
      }

      .card-float-wrapper {
        animation: float 5s ease-in-out infinite;
        transform-origin: 300px 150px;
      }

      /* Hover States and Transitions */
      .card-lift-wrapper {
        transform: translateY(0px) scale(1);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        transform-origin: 300px 150px;
      }
      .card-drop-shadow {
        transform: translateY(0px) scale(1);
        opacity: 0.25;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s;
        transform-origin: 300px 150px;
      }
      .play-hover-wrapper {
        transform: translateX(0px);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      
      .star-hover-1, .star-hover-2, .star-hover-3, .star-hover-4 {
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .star-hover-1 { transform: translate(80px, 70px) scale(1); }
      .star-hover-2 { transform: translate(520px, 90px) scale(0.85); }
      .star-hover-3 { transform: translate(120px, 240px) scale(0.65); }
      .star-hover-4 { transform: translate(490px, 230px) scale(0.75); }

      /* Hover Actions */
      .card-container:hover .card-lift-wrapper {
        transform: translateY(-8px) scale(1.015);
      }
      .card-container:hover .card-drop-shadow {
        transform: translateY(16px) scale(0.95);
        opacity: 0.15;
      }
      .card-container:hover .play-hover-wrapper {
        transform: translateX(8px);
      }
      .card-container:hover .star-hover-1 { transform: translate(80px, 55px) scale(1.15); }
      .card-container:hover .star-hover-2 { transform: translate(520px, 75px) scale(1.05); }
      .card-container:hover .star-hover-3 { transform: translate(120px, 250px) scale(0.85); }
      .card-container:hover .star-hover-4 { transform: translate(490px, 240px) scale(0.95); }

      /* Active / Click Actions */
      .card-container:active .card-lift-wrapper {
        transform: translateY(4px) scale(0.97);
        transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .card-container:active .card-drop-shadow {
        transform: translateY(-2px) scale(0.99);
        opacity: 0.3;
        transition: all 0.15s;
      }
      .card-container:active .star-hover-1 { transform: translate(80px, 65px) scale(1); transition-duration: 0.15s; }
      .card-container:active .star-hover-2 { transform: translate(520px, 85px) scale(0.85); transition-duration: 0.15s; }

      /* Internal Animations */
      .gloss-sweep {
        animation: sweep 5s ease-in-out infinite;
      }
      .play-pulse-wrapper {
        animation: pulse 2.5s ease-in-out infinite;
        transform-origin: 430px 150px;
      }
      .star-1-bob { animation: bob1 5s ease-in-out infinite; }
      .star-2-bob { animation: bob2 4s ease-in-out infinite; }
      .star-3-bob { animation: bob3 6s ease-in-out infinite; }
      
      .star-rot-1 { animation: rot1 16s linear infinite; }
      .star-rot-2 { animation: rot2 14s linear infinite; }
      .star-rot-3 { animation: rot3 18s linear infinite; }

      /* Keyframes */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes sweep {
        0%, 15% { transform: translateX(0px); }
        85%, 100% { transform: translateX(700px); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @keyframes bob1 {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes bob2 {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(8px); }
      }
      @keyframes bob3 {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes rot1 { to { transform: rotate(360deg); } }
      @keyframes rot2 { to { transform: rotate(-360deg); } }
      @keyframes rot3 { to { transform: rotate(360deg); } }

      /* Accessibility */
      @media (prefers-reduced-motion: reduce) {
        .card-float-wrapper, .gloss-sweep, .star-rot-1, .star-rot-2, .star-rot-3, 
        .star-1-bob, .star-2-bob, .star-3-bob, .play-pulse-wrapper {
          animation: none !important;
        }
      }

      /* Text Styles */
      .text-khmer {
        font-family: 'Kantumruy Pro', 'Hanuman', 'Suwannaphum', system-ui, sans-serif;
        font-size: 44px;
        font-weight: 700;
        fill: #ffffff;
        filter: url(#text-shadow);
      }
      .text-en {
        font-family: 'Nunito', 'Segoe UI', 'SF Pro Rounded', system-ui, sans-serif;
        font-size: 20px;
        font-weight: 800;
        fill: #FFE0B2;
      }
      /* ]]> */
    </style>

    <!-- Gradients and Filters -->
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <linearGradient id="arrow-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <linearGradient id="gloss-grad-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="1.5" flood-color="#C62828" flood-opacity="0.3"/>
    </filter>

    <filter id="star-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#FF9800" flood-opacity="0.3"/>
    </filter>

    <clipPath id="card-clip">
      <rect x="100" y="80" width="400" height="140" rx="40" />
    </clipPath>

    <!-- Shared Star Path -->
    <path id="star-path" d="M 0 -16 L 4.7 -4.7 L 16 -4.7 L 6.8 2.6 L 10 14 L 0 7.4 L -10 14 L -6.8 2.6 L -16 -4.7 L -4.7 -4.7 Z" stroke-linejoin="round" />
  </defs>

  <title>Continue Learning</title>

  <g class="card-container">
    <!-- Invisible hover area expansion -->
    <rect x="70" y="50" width="460" height="200" fill="transparent" />
    
    <g class="card-float-wrapper">
      
      <!-- Drop Shadow -->
      <rect class="card-drop-shadow" x="105" y="105" width="390" height="125" rx="35" fill="#D35400" filter="url(#shadow-blur)" />

      <!-- Floating Stars Background -->
      <g class="star-hover-1">
        <g class="star-1-bob">
          <g class="star-rot-1">
            <use href="#star-path" fill="#FFD54F" stroke="#F57C00" stroke-width="2" filter="url(#star-shadow)" />
          </g>
        </g>
      </g>
      
      <g class="star-hover-2">
        <g class="star-2-bob">
          <g class="star-rot-2">
            <use href="#star-path" fill="#FFF59D" stroke="#FBC02D" stroke-width="2" filter="url(#star-shadow)" />
          </g>
        </g>
      </g>

      <g class="star-hover-3">
        <g class="star-3-bob">
          <g class="star-rot-3">
            <use href="#star-path" fill="#FFD54F" stroke="#F57C00" stroke-width="2" filter="url(#star-shadow)" />
          </g>
        </g>
      </g>

      <g class="star-hover-4">
        <g class="star-2-bob">
          <g class="star-rot-2">
            <use href="#star-path" fill="#FFCC80" stroke="#EF6C00" stroke-width="2" filter="url(#star-shadow)" />
          </g>
        </g>
      </g>

      <!-- Main Button Body -->
      <g class="card-lift-wrapper">
        <!-- 3D Bottom Extrusion -->
        <rect class="card-bottom" x="100" y="88" width="400" height="140" rx="40" fill="#D84315" />
        
        <!-- Main Top Surface -->
        <rect class="card-top" x="100" y="80" width="400" height="140" rx="40" fill="url(#card-grad)" />
        
        <!-- Gloss, Highlights and Text -->
        <g clip-path="url(#card-clip)">
          <!-- Top Inner Rim Light -->
          <rect x="104" y="84" width="392" height="132" rx="36" fill="none" stroke="#FFD54F" stroke-width="3" stroke-opacity="0.8" />
          
          <!-- Animated Sweeping Gloss -->
          <g class="gloss-sweep">
            <rect x="-150" y="0" width="100" height="300" fill="url(#gloss-grad-sweep)" transform="skewX(-25)" />
          </g>
        </g>

        <!-- Typography -->
        <text x="140" y="142" class="text-khmer">បន្តរៀន</text>
        <text x="142" y="176" class="text-en">Continue Learning</text>

        <!-- Play Icon Group -->
        <g class="play-hover-wrapper">
          <g class="play-pulse-wrapper">
            <!-- Play Button 3D Shadow/Base -->
            <circle cx="430" cy="156" r="38" fill="#FFE0B2" />
            <!-- Play Button Top Surface -->
            <circle cx="430" cy="150" r="38" fill="#FFFFFF" />
            <!-- Play Button Inner Rim -->
            <circle cx="430" cy="150" r="34" fill="none" stroke="#F5F5F5" stroke-width="2" />
            <!-- Play Arrow -->
            <path d="M 424 138 L 424 162 L 446 150 Z" fill="url(#arrow-grad)" stroke="url(#arrow-grad)" stroke-width="8" stroke-linejoin="round" />
          </g>
        </g>
        
      </g>
    </g>
  </g>
</svg>
